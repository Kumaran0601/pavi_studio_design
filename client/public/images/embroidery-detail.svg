<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8a0038"/>
      <stop offset="60%" stop-color="#5a0024"/>
      <stop offset="100%" stop-color="#360015"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g opacity="0.08" stroke="#ffeaa7" stroke-width="0.5">
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 20 10 M 10 0 L 10 20"/>
    </pattern>
    <rect width="800" height="600" fill="url(#weave)"/>
  </g>

  <!-- Ornate Border Frame -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  
      <!-- Intricate floral medallion & needlework -->
      <g transform="translate(400, 270)">
        <circle cx="0" cy="0" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8,6" opacity="0.8"/>
        <circle cx="0" cy="0" r="130" fill="#500021" stroke="url(#goldGrad)" stroke-width="2"/>
        <circle cx="0" cy="0" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
        <circle cx="0" cy="0" r="25" fill="#ffd700" stroke="#aa820a" stroke-width="3"/>
        <g transform="rotate(0)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(22.5)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(45)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(67.5)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(90)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(112.5)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(135)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(157.5)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(180)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(202.5)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(225)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(247.5)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(270)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(292.5)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(315)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g><g transform="rotate(337.5)"><path d="M 0 -85 C -25 -110, -15 -140, 0 -150 C 15 -140, 25 -110, 0 -85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/><circle cx="0" cy="-125" r="5" fill="#ffeaa7"/></g>
        <!-- Golden Needle Representation -->
        <g transform="rotate(-35) translate(40, -60)">
          <line x1="-120" y1="0" x2="160" y2="0" stroke="#fff9f2" stroke-width="4" stroke-linecap="round"/>
          <line x1="160" y1="0" x2="220" y2="40" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="5,5"/>
        </g>
      </g>
    

  <!-- Typography Badge -->
  <g transform="translate(400, 520)" text-anchor="middle">
    <rect x="-190" y="-22" width="380" height="42" rx="6" fill="#360015" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.95"/>
    <text y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#ffd700" letter-spacing="3">AARI EMBROIDERY WORK</text>
    <text y="24" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#ffeaa7" letter-spacing="4">TRADITIONAL HAND CRAFT</text>
  </g>
</svg>