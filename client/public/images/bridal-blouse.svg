<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8a0038"/>
      <stop offset="60%" stop-color="#5a0024"/>
      <stop offset="100%" stop-color="#360015"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle silk weave texture -->
  <g opacity="0.08" stroke="#ffeaa7" stroke-width="0.5">
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 20 10 M 10 0 L 10 20"/>
    </pattern>
    <rect width="800" height="600" fill="url(#weave)"/>
  </g>

  <!-- Ornate Border Frame -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Bridal Blouse Neckline & Aari Handwork Motif -->
  <g transform="translate(400, 260)">
    <!-- Central Neckline Cut -->
    <path d="M -160 -180 C -140 -20, -100 80, 0 130 C 100 80, 140 -20, 160 -180" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M -150 -170 C -130 -10, -90 70, 0 115 C 90 70, 130 -10, 150 -170" fill="none" stroke="#fff9f2" stroke-width="2" stroke-dasharray="4,6"/>
    
    <!-- Zardozi & Kundan Stone Dots along neckline -->
    <g fill="#ffeaa7" stroke="#aa820a" stroke-width="1">
      <circle cx="-130" cy="-60" r="6"/>
      <circle cx="-100" cy="10" r="7"/>
      <circle cx="-60" cy="65" r="7"/>
      <circle cx="0" cy="95" r="9" fill="#ffd700"/>
      <circle cx="60" cy="65" r="7"/>
      <circle cx="100" cy="10" r="7"/>
      <circle cx="130" cy="-60" r="6"/>
    </g>

    <!-- Peacock & Mango Paisley motifs -->
    <path d="M 0 135 C -35 170, -60 210, -30 250 C 0 280, 50 250, 40 210 C 30 170, 10 150, 0 135 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="5" cy="210" r="12" fill="#8a0038" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="5" cy="210" r="5" fill="#ffd700"/>

    <!-- Floral Vine Sprays Left & Right -->
    <g stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <!-- Left branches -->
      <path d="M -90 40 C -150 50, -210 20, -260 60"/>
      <path d="M -170 35 C -200 80, -240 100, -270 90"/>
      <circle cx="-260" cy="60" r="8" fill="#d4af37"/>
      <circle cx="-270" cy="90" r="6" fill="#ffeaa7"/>
      
      <!-- Right branches -->
      <path d="M 90 40 C 150 50, 210 20, 260 60"/>
      <path d="M 170 35 C 200 80, 240 100, 270 90"/>
      <circle cx="260" cy="60" r="8" fill="#d4af37"/>
      <circle cx="270" cy="90" r="6" fill="#ffeaa7"/>
    </g>
  </g>

  <!-- Typography Badge -->
  <g transform="translate(400, 520)" text-anchor="middle">
    <rect x="-190" y="-22" width="380" height="42" rx="6" fill="#360015" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9"/>
    <text y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#ffd700" letter-spacing="3">PAVI DESIGNER STUDIO</text>
    <text y="24" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#ffeaa7" letter-spacing="4">BRIDAL AARI EMBROIDERY</text>
  </g>
</svg>
