<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8a0038"/>
      <stop offset="60%" stop-color="#5a0024"/>
      <stop offset="100%" stop-color="#360015"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g opacity="0.08" stroke="#ffeaa7" stroke-width="0.5">
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 20 10 M 10 0 L 10 20"/>
    </pattern>
    <rect width="800" height="600" fill="url(#weave)"/>
  </g>

  <!-- Ornate Border Frame -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  
      <!-- Hands-on Workshop / Studio Community -->
      <g transform="translate(400, 260)">
        <!-- Embroidery Wooden Hoop (Adda Frame) -->
        <circle cx="0" cy="0" r="150" fill="#5a0024" stroke="url(#goldGrad)" stroke-width="12"/>
        <circle cx="0" cy="0" r="130" fill="none" stroke="#ffeaa7" stroke-width="2" stroke-dasharray="5,5"/>
        <rect x="135" y="-18" width="40" height="36" rx="4" fill="#aa820a" stroke="#ffd700" stroke-width="2"/>
        <!-- Fabric with stitches in progress -->
        <path d="M -80 -40 Q 0 80 80 -40" fill="none" stroke="#ffd700" stroke-width="5" stroke-dasharray="8,6"/>
        <!-- Student & Teacher Learning Badge -->
        <circle cx="0" cy="15" r="55" fill="#360015" stroke="url(#goldGrad)" stroke-width="3"/>
        <text y="8" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" fill="#ffd700">AARI</text>
        <text y="30" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#ffeaa7" letter-spacing="2">TRAINING</text>
      </g>
    

  <!-- Typography Badge -->
  <g transform="translate(400, 520)" text-anchor="middle">
    <rect x="-190" y="-22" width="380" height="42" rx="6" fill="#360015" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.95"/>
    <text y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#ffd700" letter-spacing="3">AARI TRAINING CENTER</text>
    <text y="24" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#ffeaa7" letter-spacing="4">GUIDED 1-MONTH COURSE</text>
  </g>
</svg>