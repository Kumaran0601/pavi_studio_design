<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8a0038"/>
      <stop offset="60%" stop-color="#5a0024"/>
      <stop offset="100%" stop-color="#360015"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g opacity="0.08" stroke="#ffeaa7" stroke-width="0.5">
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 20 10 M 10 0 L 10 20"/>
    </pattern>
    <rect width="800" height="600" fill="url(#weave)"/>
  </g>

  <!-- Ornate Border Frame -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  
      <!-- Deep U-Back & Intricate Cutwork Design -->
      <g transform="translate(400, 250)">
        <path d="M -150 -160 C -140 100, -80 160, 0 160 C 80 160, 140 100, 150 -160" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
        <path d="M -125 -140 C -115 80, -60 135, 0 135 C 60 135, 115 80, 125 -140" fill="none" stroke="#ffeaa7" stroke-width="2" stroke-dasharray="4,6"/>
        <!-- Dori Tassels Hanging Down -->
        <line x1="0" y1="-80" x2="0" y2="70" stroke="url(#goldGrad)" stroke-width="3"/>
        <polygon points="-25,70 25,70 0,115" fill="#ffd700" stroke="#aa820a" stroke-width="2"/>
        <!-- Latkan Bells -->
        <circle cx="-50" cy="20" r="14" fill="#d4af37"/>
        <circle cx="50" cy="20" r="14" fill="#d4af37"/>
        <circle cx="0" cy="125" r="8" fill="#ffeaa7"/>
      </g>
    

  <!-- Typography Badge -->
  <g transform="translate(400, 520)" text-anchor="middle">
    <rect x="-190" y="-22" width="380" height="42" rx="6" fill="#360015" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.95"/>
    <text y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#ffd700" letter-spacing="3">BRIDAL BACK NECKLINE</text>
    <text y="24" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#ffeaa7" letter-spacing="4">INTRICATE CUTWORK</text>
  </g>
</svg>