<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8a0038"/>
      <stop offset="60%" stop-color="#5a0024"/>
      <stop offset="100%" stop-color="#360015"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g opacity="0.08" stroke="#ffeaa7" stroke-width="0.5">
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 20 10 M 10 0 L 10 20"/>
    </pattern>
    <rect width="800" height="600" fill="url(#weave)"/>
  </g>

  <!-- Ornate Border Frame -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  
      <!-- Flowing Zari Threads & Paisley Motif -->
      <g transform="translate(400, 260)">
        
          <path d="M -280 -220 Q 0 -40 280 -180" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>
        
          <path d="M -260 -160 Q 0 20 260 -120" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6799999999999999"/>
        
          <path d="M -240 -100 Q 0 80 240 -60" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.76"/>
        
          <path d="M -220 -40 Q 0 140 220 0" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.84"/>
        
          <path d="M -200 20 Q 0 200 200 60" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.9199999999999999"/>
        
        <g transform="translate(0, 10)">
          <path d="M 0 -80 C 80 -120, 140 -40, 100 40 C 60 120, -60 110, -90 40 C -120 -30, -50 -70, 0 -80 Z" fill="#680029" stroke="url(#goldGrad)" stroke-width="6"/>
          <circle cx="10" cy="15" r="28" fill="#d4af37"/>
          <circle cx="10" cy="15" r="10" fill="#360015"/>
        </g>
      </g>
    

  <!-- Typography Badge -->
  <g transform="translate(400, 520)" text-anchor="middle">
    <rect x="-190" y="-22" width="380" height="42" rx="6" fill="#360015" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.95"/>
    <text y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#ffd700" letter-spacing="3">ZARI & THREAD ART</text>
    <text y="24" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#ffeaa7" letter-spacing="4">FINE DETAILING</text>
  </g>
</svg>